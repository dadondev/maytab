<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maytab — Dars jadvali boti</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { font-size: 16px; opacity: 0.9; margin-bottom: 24px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .btn {
      display: inline-block;
      background: #fff;
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3); }
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 24px 0;
      text-align: left;
    }
    .feature {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
    }
    .feature span { font-size: 20px; display: block; margin-bottom: 4px; }
    .footer { font-size: 12px; opacity: 0.7; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📅</div>
    <h1>Maytab</h1>
    <p class="subtitle">Maktab dars jadvallarini boshqarish boti</p>

    <div class="status">
      <span class="dot"></span>
      <span>Bot ishlamoqda</span>
    </div>

    <div class="features">
      <div class="feature"><span>👤</span>Ro'yxatdan o'tish va shaxsiy jadvallar</div>
      <div class="feature"><span>📚</span>Barcha sinflar jadvallari</div>
      <div class="feature"><span>🔔</span>Kunlik avtomatik yuborish</div>
      <div class="feature"><span>👥</span>Guruh chatlariga jadval yuborish</div>
    </div>

    <a class="btn" href="https://t.me/maytab_bot" target="_blank" rel="noopener">🤖 Botni ochish</a>

    <p class="footer">© 2026 Maytab · Telegram bot</p>
  </div>
</body>
</html>
